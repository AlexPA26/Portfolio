<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body>

    <form id="busquedaID" class="forms">
        <label for="busqueda">Buscar Pokémon:</label>
        <input id="busqueda" type="search" placeholder="Nombre del Pokémon..">
        <button id="enviar" type="submit">Confirmar</button>
    </form>

    <br>
    
    <button class="boton">Generar PKMN</button>
    <button id="btnSiguiente">Siguiente PKMN</button>
    <div id="card" hidden>
        
        <img id="image" src="/actividades/pokemon/images/pokeball.png" alt="pokemon">
        <h1 id="name"></h1>
        <span id="weight"></span>
        <span id="height"></span>
        <h3 id="number"></h3>

    </div>

    <h1 id="loading"></h1>

</body>
</html>
